# Model configuration for every Bulbul agent.
#
# - `providers`: one entry per LLM provider. A provider whose API key env var is
#   empty is skipped at startup (with a warning), so the chain just gets shorter.
# - `chains`: ordered fallback lists. The first model is tried first; on an error,
#   timeout, rate limit, or invalid structured output, the next one is used.
# - `params` are per model entry because providers accept different parameters
#   (e.g. current Claude models reject `temperature`).
# - `catalog`: the models a user can pick in the UI's model menu. A picked model is
#   tried first by every agent for that run; the agent's own chain stays behind it
#   as the fallback. "Auto" (no pick) uses each agent's chain as configured.
# - `agents`: which chain each agent uses. Add a new chain and point an agent at it
#   to change that agent's models without touching code.
#
# Note (2026-11-15): gemini-2.5-flash is rejected for new API keys, and gemini-3.7/3.8-flash
# were timing out (504) on this key, so the chain starts with gemini-3.5-flash.

providers:
  google:    { api_key_env: GOOGLE_API_KEY }
  openai:    { api_key_env: OPENAI_API_KEY }
  anthropic: { api_key_env: ANTHROPIC_API_KEY }
  xai:       { api_key_env: XAI_API_KEY }

chains:
  default:
    - { provider: google,    model: gemini-3.5-flash,      params: { temperature: 0.3 }, timeout_s: 30 }
    - { provider: google,    model: gemini-3.5-flash-lite, params: {},                   timeout_s: 20, hedge_after_s: 6 }
    - { provider: openai,    model: gpt-5-mini,       params: {},                   timeout_s: 30 }  # TODO: confirm current OpenAI model id
    - { provider: anthropic, model: claude-opus-5-5,  params: {},                   timeout_s: 90 }
    - { provider: xai,       model: grok-4,           params: { temperature: 0.3 }, timeout_s: 30 }  # TODO: confirm current Grok model id

  # Lower randomness for routing / structured decisions.
  precise:
    - { provider: google,    model: gemini-3.5-flash,      params: { temperature: 0 },   timeout_s: 30 }
    - { provider: google,    model: gemini-3.5-flash-lite, params: {},                     timeout_s: 20, hedge_after_s: 6 }
    - { provider: openai,    model: gpt-5-mini,       params: {},                   timeout_s: 30 }
    - { provider: anthropic, model: claude-opus-5-5,  params: {},                   timeout_s: 90 }
    - { provider: xai,       model: grok-4,           params: { temperature: 0 },   timeout_s: 30 }

  # Fast routing: Flash-Lite scored 15/15 on routing benchmarks at ~1.3s median
  # (vs 5-10s for gemini-3.5-flash). Full Flash stays as the first fallback.
  # hedge_after_s: Flash-Lite answers these short calls in ~1-1.5 s, but under load 1 in 10
  # takes 6-17 s; after 3 s the same request is sent again and the faster answer wins.
  fast:
    - { provider: google,    model: gemini-3.5-flash-lite, params: {},                     timeout_s: 20, hedge_after_s: 3 }
    - { provider: google,    model: gemini-3.5-flash,      params: { temperature: 0 },   timeout_s: 30 }
    - { provider: openai,    model: gpt-5-mini,       params: {},                   timeout_s: 30 }
    - { provider: anthropic, model: claude-opus-5-5,  params: {},                   timeout_s: 90 }
    - { provider: xai,       model: grok-4,           params: { temperature: 0 },   timeout_s: 30 }

# Models shown in the UI's model picker, in menu order. Providers without an API key
# show as unavailable.
catalog:
  - { id: gemini-3.5-flash,      name: Gemini 3.5 Flash,      description: Balanced speed and quality,
      provider: google,    model: gemini-3.5-flash,      params: { temperature: 0.3 }, timeout_s: 30 }
  - { id: gemini-3.5-flash-lite, name: Gemini 3.5 Flash-Lite, description: Fastest replies,
      provider: google,    model: gemini-3.5-flash-lite, params: {},                   timeout_s: 20 }
  - { id: gpt-5-mini,            name: GPT-5 mini,            description: OpenAI,
      provider: openai,    model: gpt-5-mini,            params: {},                   timeout_s: 30 }
  - { id: claude-opus-5-5,       name: Claude Opus 5.5,       description: Most capable; slower,
      provider: anthropic, model: claude-opus-5-5,       params: {},                   timeout_s: 90 }
  - { id: grok-4,                name: Grok 4,                description: xAI,
      provider: xai,       model: grok-4,                params: { temperature: 0.3 }, timeout_s: 30 }

policy:
  retries_per_model: 1   # SDK-level retries before moving to the next model
  quota_cooldown_s: 600  # after a "quota exhausted" (429), skip the model this long unless it says when to retry

agents:
  supervisor: { chain: fast }      # routing + clarify decisions
  memory:     { chain: fast }      # learns facts about the user after each reply
  responder:  { chain: default }   # streams the final answer to the user
  voice_responder: { chain: fast } # spoken replies (voicecat): speed matters most
  general:    { chain: default }
  chef:       { chain: default }
  shopping:   { chain: fast }      # short tool-calling turns while the user waits (often driving)
